# Adonis's own database. Deliberately on 5433, not the default 5432, so it can
# never collide with any other Postgres already running on this machine.
services:
  db:
    image: postgres:17-alpine
    container_name: adonis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adonis
      POSTGRES_PASSWORD: adonis_dev
      POSTGRES_DB: adonis
    ports:
      - '5433:5432'
    volumes:
      - adonis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adonis -d adonis']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adonis_pgdata:
    name: adonis_pgdata
