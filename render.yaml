# Render blueprint: one web service + one managed Postgres.
#
# Chosen because it needs no CLI and no credit card on the free tier — push the
# repo, point Render at it, and DATABASE_URL is wired in automatically.
#
# HTTPS matters here beyond the padlock: the browser Geolocation API refuses to
# run on an insecure origin, so "use my location" only works once deployed behind
# TLS (localhost is the one exemption). Render terminates TLS for you.
services:
  - type: web
    name: sundial
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Marks the session cookie Secure, which needs the TLS that Render provides.
      - key: DATABASE_URL
        fromDatabase:
          name: sundial-db
          property: connectionString
      # Optional: adds comedy, music and theatre listings. Sport works without it.
      - key: TICKETMASTER_API_KEY
        sync: false

databases:
  - name: sundial-db
    plan: free
    databaseName: sundial
    user: sundial
